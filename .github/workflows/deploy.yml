name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
      PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
      PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
      ACCESS_EMAIL: ${{ vars.ACCESS_EMAIL }}
      AI_GATEWAY_DAILY_SPEND_CENTS: ${{ vars.AI_GATEWAY_DAILY_SPEND_CENTS || '500' }}
      AI_GATEWAY_LOG_LIMIT: ${{ vars.AI_GATEWAY_LOG_LIMIT || '10000' }}
      AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
      KRAKEN_KEY: ${{ secrets.KRAKEN_KEY }}
      KRAKEN_SECRET: ${{ secrets.KRAKEN_SECRET }}
      KRAKEN_EXPORT_KEY: ${{ secrets.KRAKEN_EXPORT_KEY }}
      KRAKEN_EXPORT_SECRET: ${{ secrets.KRAKEN_EXPORT_SECRET }}
      ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
      ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      EMAIL_KEY: ${{ secrets.EMAIL_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Deploy
        run: pnpm --filter @ironcage/infra exec alchemy deploy --stage prod --yes
