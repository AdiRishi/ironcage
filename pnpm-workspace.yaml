packages:
  - apps/*
  - packages/*
  - scripts
  - tooling/*

# The catalog is the single place dependency versions are pinned for the whole
# monorepo. Workspace packages reference `catalog:` and never a literal version.
#
# `catalog.effect` is also what `pnpm sync:repos` reads to decide which tag of
# the Effect source tree to vendor into `.repos/effect` — so the vendored
# reference and the version we compile against cannot drift apart.
catalog:
  "@base-ui/react": ^1.7.0
  "@cloudflare/vitest-pool-workers": ^0.20.3
  "@effect/vitest": 4.0.0-beta.105
  "@fontsource-variable/ibm-plex-sans": ^5.3.0
  "@fontsource-variable/space-grotesk": ^5.3.0
  # IBM Plex Mono has no variable build upstream, so its weights are imported
  # individually. The design uses 400, 500, and 600.
  "@fontsource/ibm-plex-mono": ^5.3.0
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/devtools-vite": ^0.8.3
  "@tanstack/react-devtools": ^0.10.9
  "@tanstack/react-query": ^5.101.4
  "@tanstack/react-query-devtools": ^5.101.4
  "@tanstack/react-router": ^1.170.22
  "@tanstack/react-router-devtools": ^1.167.1
  "@tanstack/react-router-ssr-query": ^1.167.1
  "@tanstack/react-start": 1.168.39
  "@tanstack/router-plugin": ^1.168.27
  "@testing-library/dom": ^10.4.1
  "@testing-library/jest-dom": ^7.0.0
  "@testing-library/react": ^16.3.2
  "@testing-library/user-event": ^14.6.3
  "@types/node": 26.1.2
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@vitejs/plugin-react": ^6.0.5
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  csv-parse: ^7.0.2
  effect: 4.0.0-beta.105
  jsdom: ^30.0.1
  lucide-react: ^1.30.0
  nitro: ^3.0.260610-beta
  oxfmt: ^0.62.0
  pg: ^8.22.0
  "@types/pg": ^8.16.0
  oxlint: ^1.77.0
  oxlint-tsgolint: 7.0.2001
  react: ^19.2.8
  react-dom: ^19.2.8
  shadcn: ^4.16.2
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  turbo: ^2.10.8
  tw-animate-css: ^1.4.0
  typescript: ~7.0.2
  vite: ^8.2.1
  vitest: ^4.1.10
  wrangler: ^4.120.0
  yaml: ^2.9.0

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  msgpackr-extract: false
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAge: 1440
