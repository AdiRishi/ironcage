packages:
  - apps/*
  - containers/*
  - infra
  - packages/*
  - scripts
  - tooling/*

# The catalog is the single place dependency versions are pinned for the whole
# monorepo. Workspace packages reference `catalog:` and never a literal version.
#
# `catalog.effect` is also what `pnpm sync:repos` reads to decide which tag of
# the Effect source tree to vendor into `.repos/effect` — so the vendored
# reference and the version we compile against cannot drift apart.
catalog:
  "@cloudflare/containers": 0.3.7
  "@cloudflare/workers-types": 5.20260814.1
  "@distilled.cloud/cloudflare": 1.0.0-rc.4
  alchemy: 2.0.0-beta.72
  "@base-ui/react": ^1.7.0
  "@cloudflare/vite-plugin": 1.52.1
  "@cloudflare/vitest-pool-workers": ^0.21.3
  "@effect/vitest": 4.0.0-rc.109
  "@effect/platform-node": 4.0.0-rc.109
  "@fontsource-variable/ibm-plex-sans": ^5.3.0
  "@fontsource-variable/space-grotesk": ^5.3.0
  # IBM Plex Mono has no variable build upstream, so its weights are imported
  # individually. The design uses 400, 500, and 600.
  "@fontsource/ibm-plex-mono": ^5.3.0
  "@firecrawl/anydoc": 0.1.9
  "@flue/cli": 2.0.3
  "@flue/runtime": 2.0.3
  "@flue/vite": 2.0.3
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/devtools-vite": ^0.8.3
  "@tanstack/react-devtools": ^0.10.10
  "@tanstack/react-query": ^5.101.4
  "@tanstack/react-query-devtools": ^5.101.4
  "@tanstack/react-router": ^1.170.27
  "@tanstack/react-router-devtools": ^1.167.1
  "@tanstack/react-router-ssr-query": ^1.167.1
  "@tanstack/react-start": 1.168.44
  "@tanstack/router-plugin": ^1.168.30
  "@testcontainers/postgresql": 12.1.0
  "@testing-library/dom": ^10.4.1
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.2
  "@testing-library/user-event": ^14.6.4
  "@types/node": 26.2.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@vitejs/plugin-react": ^6.0.5
  blume: ^1.4.3
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  csv-parse: 7.0.2
  effect: 4.0.0-rc.109
  jsdom: ^30.0.1
  lucide-react: ^1.31.0
  oxfmt: ^0.63.0
  pg: ^8.23.0
  "@types/pg": ^8.21.0
  oxlint: ^1.78.0
  oxlint-tsgolint: 7.0.2001
  react: ^19.2.8
  react-dom: ^19.2.8
  shadcn: ^4.18.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  turbo: ^2.10.9
  tw-animate-css: ^1.4.0
  typescript: ~7.0.2
  uuid: 14.0.1
  valibot: 1.4.2
  vite: ^8.2.1
  vitest: ^4.1.10
  wrangler: ^4.123.0
  yaml: ^2.9.0

allowBuilds:
  "@google/genai": true
  "@tailwindcss/oxide": true
  core-js-pure: true
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true
  workerd: true

minimumReleaseAge: 1440

overrides:
  "@effect/sql-d1": 4.0.0-rc.109
  "@effect/sql-sqlite-do": 4.0.0-rc.109
  workerd: 1.20260811.1

peerDependencyRules:
  allowedVersions:
    "capnp-es@0.0.14>typescript": "7"

patchedDependencies:
  "@flue/vite@2.0.3": patches/@flue__vite@2.0.3.patch
  alchemy@2.0.0-beta.72: patches/alchemy@2.0.0-beta.72.patch
